<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Gateway architecture</title>
  <desc id="desc">A governed AI agent architecture showing the direct integration path compared with the Fabric Gateway path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#101b35"/></linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6c37"/><stop offset="1" stop-color="#ff3d71"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d8bfd"/><stop offset="1" stop-color="#645bff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17c99a"/><stop offset="1" stop-color="#3dd6df"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity=".45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ff7448"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5b8cff"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:46px;font-weight:760;letter-spacing:-1.5px}.sub{font-size:20px;fill:#9fb0cb}.cap{font-size:14px;font-weight:720;letter-spacing:1.7px}.h2{font-size:25px;font-weight:730}.h3{font-size:19px;font-weight:700}.body{font-size:16px;fill:#c6d2e5}.small{font-size:14px;fill:#93a5c1}.tiny{font-size:12px;fill:#8194b2}.white{fill:#f7f9ff}.muted{fill:#9fb0cb}.card{fill:#111f38;stroke:#2b3c5c;stroke-width:1.5}.soft{fill:#0d192e;stroke:#253958;stroke-width:1.5}.pill{fill:#182946;stroke:#334a70}.dash{fill:none;stroke:#52647e;stroke-width:2;stroke-dasharray:6 8}.orangeLine{fill:none;stroke:#ff7448;stroke-width:5;marker-end:url(#arrowOrange)}.blueLine{fill:none;stroke:#5b8cff;stroke-width:3;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1800" height="1125" fill="url(#bg)"/>
  <circle cx="1510" cy="120" r="330" fill="#ff5f3d" opacity=".055"/><circle cx="250" cy="1030" r="390" fill="#4f7cff" opacity=".06"/>

  <g class="sans">
    <text x="72" y="78" class="title white">Fabric Gateway · governed agent architecture</text>
    <text x="73" y="116" class="sub">One agent. One gateway credential. Models, MCP tools and APIs governed through a unified control plane.</text>
    <g transform="translate(1465 54)"><rect width="262" height="56" rx="28" fill="#14243f" stroke="#334b70"/><circle cx="30" cy="28" r="10" fill="#20d3a2" filter="url(#glow)"/><text x="52" y="34" class="body white" font-weight="650">END-TO-END TRACE</text></g>

    <!-- Entry -->
    <g filter="url(#shadow)"><rect x="72" y="174" width="300" height="178" rx="22" class="card"/><rect x="72" y="174" width="7" height="178" rx="4" fill="url(#blue)"/></g>
    <text x="104" y="211" class="cap" fill="#78a0ff">EXPERIENCE LAYER</text>
    <text x="104" y="250" class="h2 white">Showcase UI</text>
    <text x="104" y="280" class="body">Prompt · scenario · evidence</text>
    <text x="104" y="307" class="body">Live metrics · replay · compare</text>
    <g transform="translate(104 322)"><rect width="128" height="28" rx="14" class="pill"/><text x="16" y="19" class="tiny" fill="#aecaFF">SAME WORKLOAD</text></g>

    <g filter="url(#shadow)"><rect x="425" y="174" width="330" height="178" rx="22" class="card"/><rect x="425" y="174" width="7" height="178" rx="4" fill="url(#blue)"/></g>
    <text x="457" y="211" class="cap" fill="#78a0ff">AGENT RUNTIME</text>
    <text x="457" y="250" class="h2 white">Responses agent loop</text>
    <text x="457" y="280" class="body">Reason · select · call · verify</text>
    <text x="457" y="307" class="body">Same model, prompt and assertions</text>
    <circle cx="700" cy="217" r="18" fill="#263d66"/><path d="M692 217h16m-8-8v16" stroke="#8fb0ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M372 263H425" class="blueLine"/>

    <!-- Split labels -->
    <path d="M755 263H804V468H846" class="orangeLine"/>
    <text x="786" y="245" class="small" fill="#ff9b7a">recommended path</text>
    <path d="M590 352V424H207V468" class="dash"/>
    <text x="235" y="411" class="small">comparison baseline</text>

    <!-- Direct lane -->
    <g filter="url(#shadow)"><rect x="72" y="468" width="650" height="385" rx="26" fill="#0e1b31" stroke="#344763" stroke-width="1.5"/></g>
    <text x="106" y="511" class="cap" fill="#8fa2bd">DIRECT CONNECTIONS</text>
    <text x="106" y="548" class="h2 white">Integration logic lives in the agent</text>
    <text x="106" y="577" class="small">Four routes · four credentials · client-owned resilience</text>
    <g transform="translate(106 615)">
      <rect width="270" height="56" rx="14" class="soft"/><circle cx="29" cy="28" r="11" fill="#5b8cff"/><text x="52" y="34" class="body white">OpenAI model route</text>
      <rect y="72" width="270" height="56" rx="14" class="soft"/><circle cx="29" cy="100" r="11" fill="#9d7cff"/><text x="52" y="106" class="body white">Banking MCP + key</text>
      <rect y="144" width="270" height="56" rx="14" class="soft"/><circle cx="29" cy="172" r="11" fill="#9d7cff"/><text x="52" y="178" class="body white">Support MCP + key</text>
      <rect y="216" width="270" height="56" rx="14" class="soft"/><circle cx="29" cy="244" r="11" fill="#24cda3"/><text x="52" y="250" class="body white">Fraud REST API + key</text>
    </g>
    <g transform="translate(410 615)"><rect width="276" height="272" rx="17" fill="#121f35" stroke="#2b3d5a"/>
      <text x="24" y="38" class="h3 white">Client responsibilities</text>
      <text x="24" y="78" class="body">• tool discovery &amp; schemas</text><text x="24" y="111" class="body">• retries &amp; backoff</text><text x="24" y="144" class="body">• auth &amp; secret storage</text><text x="24" y="177" class="body">• policy enforcement</text><text x="24" y="210" class="body">• trace correlation</text>
      <rect x="24" y="231" width="188" height="27" rx="13" fill="#222e43"/><text x="38" y="249" class="tiny" fill="#a8b4c7">LARGER CLIENT SURFACE</text>
    </g>

    <!-- Fabric lane -->
    <g filter="url(#shadow)"><rect x="846" y="396" width="882" height="457" rx="28" fill="#111e35" stroke="#ff714c" stroke-width="2.2"/></g>
    <rect x="846" y="396" width="882" height="8" rx="4" fill="url(#fabric)"/>
    <text x="883" y="446" class="cap" fill="#ff8b68">POSTMAN FABRIC GATEWAY</text>
    <text x="883" y="486" class="h2 white">Unified data plane</text>
    <text x="883" y="516" class="small">One agent-held gateway key · OpenAI-compatible + MCP + REST</text>
    <g transform="translate(883 550)"><rect width="238" height="62" rx="15" fill="#3a2030" stroke="#ff6a48"/><path d="M27 22l12-7 12 7v14l-12 7-12-7z" fill="none" stroke="#ff8665" stroke-width="2"/><text x="68" y="38" class="body white" font-weight="700">X-Gateway-Key</text></g>
    <path d="M1121 581H1180" class="orangeLine"/>
    <g transform="translate(1180 545)"><rect width="502" height="238" rx="20" fill="#171f36" stroke="#35425f"/>
      <text x="26" y="39" class="h3 white">Governed routing &amp; execution</text>
      <g transform="translate(26 61)"><rect width="137" height="52" rx="13" fill="#24233b"/><text x="20" y="31" class="small" fill="#d6ceff">Model route</text></g>
      <g transform="translate(177 61)"><rect width="137" height="52" rx="13" fill="#24233b"/><text x="18" y="31" class="small" fill="#d6ceff">MCP bindings</text></g>
      <g transform="translate(328 61)"><rect width="137" height="52" rx="13" fill="#1d3335"/><text x="24" y="31" class="small" fill="#9aead5">API binding</text></g>
      <text x="26" y="150" class="body">Progressive tool discovery · curated schemas</text>
      <text x="26" y="181" class="body">Policy · retry · credential injection · audit</text>
      <g transform="translate(26 198)"><rect width="177" height="26" rx="13" fill="#482837"/><text x="14" y="18" class="tiny" fill="#ffb09a">SECRETS STAY OUT OF MODEL</text></g>
    </g>
    <g transform="translate(883 631)"><rect width="238" height="152" rx="18" fill="#172840" stroke="#34516c"/><text x="22" y="35" class="h3 white">Context on demand</text><text x="22" y="68" class="body">search_tool</text><text x="22" y="96" class="body">get_tool</text><text x="22" y="124" class="body">execute_tool</text></g>
    <text x="883" y="821" class="small" fill="#ff9b7a">Central governance without changing the business task</text>

    <!-- upstreams -->
    <path d="M397 853V902" class="dash"/><path d="M1287 853V902" class="orangeLine"/>
    <g filter="url(#shadow)"><rect x="72" y="902" width="1656" height="148" rx="24" class="card"/></g>
    <text x="106" y="938" class="cap" fill="#7fd8c2">SHARED UPSTREAM CAPABILITIES</text>
    <g transform="translate(106 959)"><rect width="260" height="66" rx="16" class="soft"/><circle cx="31" cy="33" r="13" fill="#6e78ff"/><text x="57" y="30" class="h3 white">Model provider</text><text x="57" y="50" class="tiny">Responses / inference</text></g>
    <g transform="translate(389 959)"><rect width="260" height="66" rx="16" class="soft"/><circle cx="31" cy="33" r="13" fill="#9d7cff"/><text x="57" y="30" class="h3 white">Banking</text><text x="57" y="50" class="tiny">MCP → source of truth API</text></g>
    <g transform="translate(672 959)"><rect width="260" height="66" rx="16" class="soft"/><circle cx="31" cy="33" r="13" fill="#9d7cff"/><text x="57" y="30" class="h3 white">Support</text><text x="57" y="50" class="tiny">MCP → case workflow API</text></g>
    <g transform="translate(955 959)"><rect width="260" height="66" rx="16" class="soft"/><circle cx="31" cy="33" r="13" fill="#20cfa3"/><text x="57" y="30" class="h3 white">Fraud scoring</text><text x="57" y="50" class="tiny">REST risk assessment API</text></g>
    <g transform="translate(1238 959)"><rect width="454" height="66" rx="16" fill="#152943" stroke="#2c5a65"/><text x="24" y="29" class="h3 white">Operational evidence</text><text x="24" y="50" class="tiny">tokens · latency · policy · retries · final state</text><circle cx="415" cy="33" r="15" fill="#173e3f"/><path d="M407 33l6 6 11-13" fill="none" stroke="#3ce0b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- footer -->
    <text x="72" y="1092" class="small">Correlation: X-Request-Id  ·  Isolation: X-Demo-Run-Id  ·  Mutations: idempotency ledger  ·  Evidence: sanitized and replayable</text>
    <text x="1728" y="1092" text-anchor="end" class="small" fill="#ff8867">FABRIC GATEWAY SHOWCASE</text>
  </g>
</svg>
